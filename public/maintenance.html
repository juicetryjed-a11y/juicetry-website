<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>جوستري — الموقع تحت الصيانة</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f8fafc,#ecfeff);color:#0f172a;padding:24px}
    .card{max-width:760px;text-align:center;padding:34px;border-radius:12px;background:white;box-shadow:0 8px 30px rgba(2,6,23,0.08)}
    .logo{width:84px;height:84px;margin:0 auto 18px;background:url('/favicon.svg') center/contain no-repeat}
    h1{font-size:26px;margin:6px 0}
    p{color:#334155;line-height:1.6}
    .eta{display:inline-block;margin-top:14px;padding:10px 16px;background:#22c55e;color:white;border-radius:8px;font-weight:600}
    footer{margin-top:18px;color:#64748b;font-size:13px}
    a{color:#0b69ff}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="m-title">
    <div class="logo" aria-hidden="true"></div>
    <h1 id="m-title">نحن نقوم بصيانة الموقع الآن</h1>
    <p>عذراً للإزعاج — يعمل فريق جوستري الآن على تحسين وتجهيز بعض التحديثات. نرجو المحاولة لاحقاً. للمستعجلات: <a href="mailto:support@juicetry.com">support@juicetry.com</a></p>
    <div class="eta" aria-live="polite">المُتوقَّع: قريباً</div>
    <footer>لمتابعة التحديثات: تابعنا على إنستغرام / فيسبوك</footer>
  </main>
</body>
</html>
